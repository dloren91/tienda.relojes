<div class="col-span-full max-w-4xl mx-auto w-full bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-6 md:p-10 shadow-2xl grid grid-cols-1 md:grid-cols-2 gap-8 items-center my-4">

    <!-- Columna Izquierda: Imagen -->
    <div class="w-full bg-slate-950 border border-slate-800 rounded-xl p-8 flex justify-center items-center min-h-[280px]">
        <img class="max-w-full max-h-64 h-auto object-contain drop-shadow-[0_10px_15px_rgba(0,0,0,0.5)]" src="mostrar_imagen?id={{id}}" alt="{{modelo}}"/>
    </div>

    <!-- Columna Derecha: Información -->
    <div class="flex flex-col text-left">
        <span class="uppercase text-xs font-bold tracking-widest text-sky-400 mb-1">
            {{marca}}
        </span>

        <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight mb-3">
            {{modelo}}
        </h1>

        <div class="text-4xl font-black text-amber-400 mb-6">
            {{precio}} <span class="text-2xl font-semibold">€</span>
        </div>

        <!-- Especificaciones -->
        <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-4 mb-6 flex flex-col gap-3">
            <div class="flex justify-between text-sm text-slate-400">
                <span>Resistencia al agua:</span>
                <strong class="text-slate-100 font-semibold">{{resistenciaAgua}} m</strong>
            </div>
            <div class="flex justify-between text-sm text-slate-400">
                <span>Movimiento:</span>
                <strong class="text-slate-100 font-semibold">
                    {{#automatico}}Automático ✔{{/automatico}}{{^automatico}}No automático ✘{{/automatico}}
                </strong>
            </div>
        </div>

        <!-- Acciones -->
        <div class="flex gap-4 items-center">
            <div class="flex items-center gap-2 text-slate-300 text-sm font-semibold">
                <label for="cant-{{id}}">Cantidad:</label>
                <input id="cant-{{id}}" type="number" value="1" min="1" class="w-16 bg-slate-900 text-white border border-slate-600 rounded-lg p-2 text-center font-bold outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
            </div>

            <a href="#" class="flex-1 inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold text-base py-3 px-5 rounded-lg shadow-lg shadow-amber-500/20 hover:-translate-y-0.5 transition-all duration-200">
                🛒 Agregar al carrito
            </a>
        </div>
    </div>

</div>
