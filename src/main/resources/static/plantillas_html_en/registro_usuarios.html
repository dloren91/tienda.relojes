<section class="col-span-full w-full max-w-md mx-auto">
    <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-8 shadow-xl">

        <!-- Header -->
        <div class="text-center mb-8">
            <span class="w-14 h-14 mx-auto flex items-center justify-center text-3xl rounded-xl bg-gradient-to-br from-amber-400/20 to-amber-600/5 border border-amber-500/40 shadow-lg shadow-amber-500/10">⌚</span>
            <h2 class="font-display text-3xl font-bold text-amber-400 mt-4">Create your account</h2>
            <p class="text-sm text-slate-400 mt-1">Enter your details to sign up</p>
        </div>

        <!-- Form -->
        <form id="form_registro_usuario" class="flex flex-col gap-5">

            <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
                Full name
                <input type="text" id="nombre" name="nombre" placeholder="e.g., John Smith" required
                       class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2.5 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </label>

            <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
                Email address
                <input type="email" id="email" name="email" placeholder="email@example.com" required
                       class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2.5 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </label>

            <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
                Password
                <input type="password" id="pass" name="pass" placeholder="••••••••" required
                       class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2.5 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </label>

            <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
                Shipping address
                <input type="text" id="direccion" name="direccion" placeholder="Street, number, apartment, city"
                       class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2.5 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </label>

            <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
                Bank account (IBAN)
                <input type="text" id="cuentaBancaria" name="cuentaBancaria" placeholder="ES00 0000 0000 0000 0000 0000"
                       class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2.5 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </label>

            <button type="submit"
                    class="mt-2 w-full bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold py-3 rounded-lg shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 transition-all duration-200 cursor-pointer">
                Sign up
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account?
            <span class="text-amber-400 font-semibold">Select Sign in from the menu</span>
        </p>
    </div>
</section>
