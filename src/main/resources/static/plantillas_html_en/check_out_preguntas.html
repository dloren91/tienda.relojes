<section class="col-span-full w-full max-w-xl mx-auto flex flex-col gap-6">
    <div class="border-b border-slate-800 pb-3">
        <h2 class="text-2xl font-extrabold text-amber-400 tracking-tight">Place Order · Questions</h2>
        <p class="text-sm text-slate-400 mt-1">Tell us a bit more about your passion for watches before confirming.</p>
    </div>

    <div class="flex flex-col gap-4 bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
            <span>⌚ 1. What was the last watch you bought?</span>
            <input type="text" id="resPregunta1" placeholder="e.g., Ben 10 green watch, Casio F-91W..." class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
        </label>
        <label class="flex flex-col gap-1.5 text-sm font-semibold text-slate-300">
            <span>✨ 2. How much did it cost?</span>
            <input type="text" id="resPregunta2" placeholder="e.g., €49.99" class="bg-slate-900 text-slate-100 placeholder-slate-600 border border-slate-600 rounded-md py-2 px-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
        </label>
    </div>

    <div class="flex justify-end">
        <button id="aceptar_preguntas" class="bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-amber-500/20 transition-all duration-200 cursor-pointer">
            Continue
        </button>
    </div>
</section>
