<!-- col-span-full: el contenedor de index.html es un grid de 1-4 columnas,
     así el carrito ocupa todo el ancho en vez de repartirse en columnas -->
<section class="col-span-full w-full max-w-4xl mx-auto flex flex-col gap-6">

    <h2 class="text-2xl font-extrabold text-amber-400 tracking-tight border-b border-slate-800 pb-3">
        🛒 Tu carrito de la compra
    </h2>

    <div class="flex flex-col gap-4">
        {{#.}}
        <article class="flex flex-wrap sm:flex-nowrap items-center gap-5 bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-4 shadow-xl hover:border-amber-500/60 transition-colors duration-200">

            <!-- Imagen -->
            <div class="w-24 h-24 shrink-0 flex items-center justify-center bg-slate-950 border border-slate-800 rounded-xl p-2">
                <img class="w-full h-full object-contain"
                     src="mostrar_imagen?id={{RELOJ_ID}}"
                     alt="{{MODELO_RELOJ}}"
                     onerror="this.style.display='none'"/>
            </div>

            <!-- Título y precio -->
            <div class="flex-1 min-w-40">
                <h3 class="text-lg font-extrabold text-amber-400 leading-tight">{{MODELO_RELOJ}}</h3>
                <p class="text-sm text-slate-400 mt-1">
                    Precio unidad: <span class="text-slate-100 font-bold">{{PRECIO}} €</span>
                </p>
            </div>

            <!-- Cantidad -->
            <div class="flex items-center gap-2 text-sm text-slate-300">
                <label>Cantidad</label>
                <input type="number" min="1" value="{{CANTIDAD}}"
                       class="w-16 bg-slate-900 text-slate-100 border border-slate-600 rounded-md py-1.5 px-2 text-center font-semibold outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"/>
            </div>

            <!-- Borrar -->
            <a href="#"
               class="text-sm font-semibold text-slate-400 hover:text-rose-400 border border-slate-700 hover:border-rose-400/60 rounded-lg py-2 px-3 transition-colors">
                Borrar
            </a>
        </article>
        {{/.}}

        <!-- Carrito vacío -->
        {{^.}}
        <div class="text-center text-slate-400 bg-slate-900 border border-dashed border-slate-700 rounded-2xl py-12">
            Tu carrito está vacío. Vuelve a <strong class="text-slate-200">Relojes</strong> para añadir alguno.
        </div>
        {{/.}}
    </div>

    <!-- Acciones -->
    <div class="flex justify-end pt-4 border-t border-slate-800">
        <a href="#" id="realizar_pedido"
           class="inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 hover:text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 transition-all duration-200">
            Realizar pedido
        </a>
    </div>

</section>
