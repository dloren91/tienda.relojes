<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negozio di Orologi - Lorenzo</title>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>

    <!-- CDN di Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        .enlace_carrito,.enlace_pedidos,.enlace_cerrar_sesion,.enlace_mis_datos{
            display: none;
        }
        .font-display { font-family: 'Cormorant Garamond', Georgia, serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans antialiased">

<!-- BANNER ADMIN -->
<div class="bg-slate-950 border-b border-slate-800/80 text-right px-6 py-1.5 text-xs">
    <a href="admin/inicioAdmin" class="text-slate-500 hover:text-amber-400 transition-colors inline-flex items-center gap-1.5 font-medium">
        <span>🔒</span> Accesso Amministrazione
    </a>
</div>

<!-- INTESTAZIONE -->
<header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">

        <!-- Logo -->
        <a href="#" id="inicio" class="flex items-center gap-3.5 group">
            <span class="w-12 h-12 flex items-center justify-center text-2xl rounded-xl bg-gradient-to-br from-amber-400/20 to-amber-600/5 border border-amber-500/40 shadow-lg shadow-amber-500/10 group-hover:border-amber-400 transition-colors">⌚</span>
            <div>
                <h1 class="font-display text-3xl font-bold tracking-[0.2em] text-amber-400 leading-none">LORENZO</h1>
                <span class="text-[11px] font-medium text-slate-400 block tracking-[0.25em] mt-1.5">NEGOZIO DI OROLOGI</span>
            </div>
        </a>

        <!-- Navigazione -->
        <nav class="flex flex-wrap justify-center items-center gap-x-1 gap-y-2 text-sm font-semibold text-slate-300">
            <div class="enlace_relojes">
                <a href="#" id="relojes" class="relative px-4 py-2 hover:text-amber-400 transition-colors after:absolute after:left-4 after:right-4 after:bottom-0 after:h-0.5 after:bg-amber-400 after:origin-left after:scale-x-0 hover:after:scale-x-100 after:transition-transform">Orologi</a>
            </div>
            <div class="enlace_registrarme">
                <a href="#" id="registrarme" class="relative px-4 py-2 hover:text-amber-400 transition-colors after:absolute after:left-4 after:right-4 after:bottom-0 after:h-0.5 after:bg-amber-400 after:origin-left after:scale-x-0 hover:after:scale-x-100 after:transition-transform">Registrati</a>
            </div>
            <div class="enlace_identificarme">
                <a href="#" id="identificarme" class="inline-block px-5 py-2 rounded-full border border-amber-500/50 text-amber-300 hover:bg-amber-500 hover:text-slate-950 transition-colors">Accedi</a>
            </div>
            <div class="enlace_pedidos">
                <a href="#" id="pedidos" class="relative px-4 py-2 hover:text-amber-400 transition-colors after:absolute after:left-4 after:right-4 after:bottom-0 after:h-0.5 after:bg-amber-400 after:origin-left after:scale-x-0 hover:after:scale-x-100 after:transition-transform">I miei ordini</a>
            </div>
            <div class="enlace_mis_datos">
                <a href="#" id="mis_datos" class="relative px-4 py-2 hover:text-amber-400 transition-colors after:absolute after:left-4 after:right-4 after:bottom-0 after:h-0.5 after:bg-amber-400 after:origin-left after:scale-x-0 hover:after:scale-x-100 after:transition-transform">I miei dati</a>
            </div>
            <div class="enlace_carrito">
                <a href="#" id="carrito" class="inline-flex items-center gap-2 ml-2 px-5 py-2 rounded-full bg-amber-500/10 border border-amber-500/50 text-amber-300 hover:bg-amber-500 hover:text-slate-950 transition-colors">🛒 Carrello</a>
            </div>
            <div class="enlace_cerrar_sesion">
                <a href="#" id="cerrar_sesion" class="inline-block ml-1 px-3 py-2 text-rose-400/90 hover:text-rose-300 transition-colors">Esci</a>
            </div>
        </nav>
    </div>
</header>

<!-- BENVENUTO -->
<section class="relative overflow-hidden bg-gradient-to-b from-slate-900 to-slate-950 border-b border-slate-800">
    <!-- Quadrante decorativo -->
    <svg class="hidden md:block absolute -right-16 top-1/2 -translate-y-1/2 w-[440px] h-[440px] text-amber-400/15" viewBox="0 0 200 200" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="100" cy="100" r="96" stroke-width="1"/>
        <circle cx="100" cy="100" r="86" stroke-width="0.5"/>
        <g stroke-width="2">
            <line x1="100" y1="10" x2="100" y2="24"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(30 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(60 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(90 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(120 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(150 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(180 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(210 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(240 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(270 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(300 100 100)"/>
            <line x1="100" y1="10" x2="100" y2="24" transform="rotate(330 100 100)"/>
        </g>
        <line x1="100" y1="100" x2="100" y2="42" stroke-width="3" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="138" y2="120" stroke-width="3" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="4" fill="currentColor"/>
    </svg>

    <div class="flex justify-center items-center gap-2 pt-6">
        <a href="?idioma=es" class="px-3 py-1 text-xs font-medium rounded-full border border-amber-500/30 bg-slate-900/60 text-slate-300 hover:text-amber-400 hover:border-amber-400/80 transition-all shadow-sm">Español</a>
        <a href="?idioma=en" class="px-3 py-1 text-xs font-medium rounded-full border border-amber-500/30 bg-slate-900/60 text-slate-300 hover:text-amber-400 hover:border-amber-400/80 transition-all shadow-sm">English</a>
        <a href="?idioma=it" class="px-3 py-1 text-xs font-medium rounded-full border border-amber-500/30 bg-slate-900/60 text-slate-300 hover:text-amber-400 hover:border-amber-400/80 transition-all shadow-sm">Italiano</a>
    </div>

    <div class="relative max-w-7xl mx-auto px-6 py-14 md:py-20">
        <h2 class="inline font-display text-4xl md:text-6xl font-semibold text-amber-400 leading-tight mr-2">
            Benvenuto
        </h2>
        <h2 id="usuarioActual" class="inline font-display text-4xl md:text-6xl font-semibold text-amber-400 leading-tight">
            Utente
        </h2>
        <div class="w-16 h-0.5 bg-amber-500 mt-5 mb-5"></div>
        <p class="text-base s:text-lg text-slate-300 max-w-md leading-relaxed">
            Alta orologeria e ingegneria di precisione.
        </p>
    </div>
</section>

<!-- ========================================== -->
<!-- CONTENITORE PRINCIPALE (Template Mustache) -->
<!-- ========================================== -->
<main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Grid responsive gestita dinamicamente da Tailwind -->
    <div id="contenedor" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-2">
        <!-- Qui jQuery caricherà l'HTML dinamico dei template -->
    </div>
</main>

<!-- ========================================== -->
<!-- PIE DI PAGINA / FOOTER                     -->
<!-- ========================================== -->
<footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Orologi Lorenzo. Tutti i diritti riservati.</p>
</footer>

<!-- ========================================== -->
<!-- LIBRERIE E CODICE JAVASCRIPT               -->
<!-- ========================================== -->
<script src="librerias_js/jquery.js"></script>
<script src="librerias_js/mustache.js"></script>
<script>
    codigo_idioma="it"
</script>
<script src="javascript/validaciones.js"></script>
<script src="javascript/aplicacion.js"></script>

</body>
</html>
