<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Lorenzo Relojes</title>
    <!-- CDN de Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased flex flex-col md:flex-row">

<!-- Inserción del fragmento de Menú Lateral -->
<div th:insert="~{fragments/general.html :: menu}"></div>

<!-- ÁREA PRINCIPAL DE CONTENIDO -->
<main class="flex-1 p-6 md:p-12 flex flex-col justify-center items-center">

    <div class="w-full max-w-2xl bg-gradient-to-br from-slate-900 to-slate-900/60 border border-slate-800 rounded-2xl p-8 md:p-10 shadow-2xl text-center">

        <div class="w-16 h-16 bg-amber-400/10 border border-amber-400/20 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6">
            🛡️
        </div>

        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight mb-3">
            Bienvenido a la administración de la tienda
        </h1>

        <p class="text-slate-400 text-sm md:text-base leading-relaxed mb-6">
            Selecciona una opción del menú lateral para gestionar el catálogo de productos, usuarios registrados, categorías o pedidos de la tienda.
        </p>

        <div class="inline-flex items-center gap-2 text-xs font-semibold text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-full border border-amber-400/20">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            Panel Activo
        </div>

    </div>

</main>

</body>
</html>
