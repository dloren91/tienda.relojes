<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Relojes - Lorenzo</title>

    <!-- CDN de Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans antialiased">

<!-- ========================================== -->
<!-- PARTE SUPERIOR: BANNER ADMIN -->
<!-- ========================================== -->
<div class="bg-slate-900 border-b border-slate-800 text-right px-6 py-1.5 text-xs">
    <a href="admin/inicioAdmin" class="text-slate-400 hover:text-amber-400 transition-colors inline-flex items-center gap-1 font-medium">
        <span>🔒</span> Acceso a Administración
    </a>
</div>

<!-- ========================================== -->
<!-- ENCABEZADO Y MENÚ DE NAVEGACIÓN -->
<!-- ========================================== -->
<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-3">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">

        <!-- LOGO / NOMBRE DE LA TIENDA -->
        <div class="flex items-center gap-3">
            <span class="text-4xl">⌚</span>
            <div>
                <h1 class="text-2xl font-black tracking-widest text-amber-400 uppercase leading-none">
                    Lorenzo
                </h1>
                <span class="text-xs font-semibold text-slate-400 block tracking-wider mt-1">
                    TIENDA DE RELOJES
                </span>
            </div>
        </div>

        <!-- ENLACES DE NAVEGACIÓN -->
        <nav class="flex flex-wrap justify-center gap-1.5 text-base font-semibold text-slate-200">
            <a href="#" id="relojes" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">Relojes</a>
            <a href="#" id="registrarme" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">Registrarme</a>
            <a href="#" id="identificarme" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">Identificarme</a>
            <a href="#" id="carrito" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">🛒 Carrito</a>
            <a href="#" id="pedidos" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">Mis Pedidos</a>
            <a href="#" id="mis_datos" class="px-4 py-2 rounded-xl hover:bg-slate-800 hover:text-amber-400 transition-colors">Mis Datos</a>
            <a href="#" id="cerrar_sesion" class="px-4 py-2 rounded-xl hover:bg-red-950/50 text-red-400 hover:text-red-300 border border-transparent hover:border-red-900/50 transition-colors">Salir</a>
        </nav>

    </div>
</header>

<!-- ========================================== -->
<!-- MENSAJE DE BIENVENIDA -->
<!-- ========================================== -->
<section class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border-b border-slate-800 py-10 text-center">
    <p class="text-xl font-bold tracking-widest text-amber-400 uppercase">Bienvenido a la Tienda</p>
    <p class="text-sm text-slate-300 mt-2">Explora nuestra colección de alta relojería e ingeniería de precisión</p>
</section>

<!-- ========================================== -->
<!-- CONTENEDOR PRINCIPAL (Plantillas Mustache) -->
<!-- ========================================== -->
<main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Grid responsivo administrado dinámicamente por Tailwind -->
    <div id="contenedor" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-2">
        <!-- Aquí jQuery cargará el HTML dinámico de las plantillas -->
    </div>
</main>

<!-- ========================================== -->
<!-- PIE DE PÁGINA -->
<!-- ========================================== -->
<footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Relojes Lorenzo. Todos los derechos reservados.</p>
</footer>

<!-- ========================================== -->
<!-- LIBRERÍAS Y CÓDIGO JAVASCRIPT -->
<!-- ========================================== -->
<script src="librerias_js/jquery.js"></script>
<script src="librerias_js/mustache.js"></script>

<script>
    let plantilla_inicio = "";
    let plantilla_productos = "";
    let plantilla_detalles_producto = "";

    // 1. Descarga de plantillas HTML
    $.get("plantillas_html/inicio.html").done(function(res){
        plantilla_inicio = res;
    });

    $.get("plantillas_html/listado_productos.html").done(function(res){
        plantilla_productos = res;
    });

    $.get("plantillas_html/detalles_producto.html").done(function(res){
        plantilla_detalles_producto = res;
    });

    // 2. Funciones principales
    function mostrar_relojes(){
        $.getJSON("RESTrelojes/listar").done(function(json){
            console.log(json);
            var resultadoMustache = Mustache.render(plantilla_productos, json);
            $("#contenedor").html(resultadoMustache);
        });
    }

    function mostrar_detalles(id){
        $.getJSON("RESTrelojes/obtener-reloj", { id: id }).done(function(json){
            console.log(json);
            var resultadoHtml = Mustache.render(plantilla_detalles_producto, json);
            $("#contenedor").html(resultadoHtml);
        });
    }

    // 3. Eventos de clics
    $("#inicio").click(function(e) {
        e.preventDefault();
        $("#contenedor").html(plantilla_inicio);
    });

    $("#relojes").click(function(e) {
        e.preventDefault();
        mostrar_relojes();
    });

    $("#registrarme").click(function(e) {
        e.preventDefault();
        alert("Pestaña para registrarme");
    });

    $("#identificarme").click(function(e) {
        e.preventDefault();
        alert("Pestaña para identificarme");
    });

    $("#carrito").click(function(e) {
        e.preventDefault();
        alert("Mostrar productos del carrito");
    });

    $("#pedidos").click(function(e) {
        e.preventDefault();
        alert("Ver mis pedidos");
    });

    $("#mis_datos").click(function(e) {
        e.preventDefault();
        alert("Mostrar mis datos");
    });

    $("#cerrar_sesion").click(function(e) {
        e.preventDefault();
        alert("Cerrar la sesión");
    });

    // Carga inicial
    mostrar_relojes();
</script>

</body>
</html>
